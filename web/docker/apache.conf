<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public

    # Laravel's public/.htaccess sends every request to index.php.
    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>

    # Render shows whatever the container writes to stdout/stderr.
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>

# Render free has 512 MB RAM; a few PHP processes are enough for a demo and keep memory in check.
<IfModule mpm_prefork_module>
    StartServers 2
    MinSpareServers 1
    MaxSpareServers 3
    MaxRequestWorkers 5
</IfModule>
